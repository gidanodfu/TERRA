name: terra

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - terra-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - terra

  api:
    build:
      context: ../backend
    env_file:
      - ../.env
    environment:
      STORAGE_ROOT: /var/lib/terra
    volumes:
      - ${STORAGE_HOST_PATH:-../data/dev}:/var/lib/terra:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - terra

  worker:
    build:
      context: ../backend
    command: ["/app/worker"]
    env_file:
      - ../.env
    environment:
      STORAGE_ROOT: /var/lib/terra
    volumes:
      - ${STORAGE_HOST_PATH:-../data/dev}:/var/lib/terra:rw
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - terra
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ../frontend
      args:
        VITE_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - terra

volumes:
  terra-db:

networks:
  terra:
    driver: bridge
