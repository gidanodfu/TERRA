name: terra

# Distribución local de desarrollo de TERRA.
# Exactamente cuatro servicios: web (Vite), api, worker y db.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - terra-db:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    image: terra-backend:local
    build:
      context: ../backend
    user: "${TERRA_UID:-1000}:${TERRA_GID:-1000}"
    env_file:
      - ../.env
    environment:
      APP_ENV: development
      STORAGE_ROOT: /var/lib/terra
      HOME: /tmp
      GOCACHE: /tmp/gocache
      GOMODCACHE: /go/pkg/mod
      GOPATH: /tmp/gopath
    working_dir: /src
    command: ["go", "run", "./cmd/api"]
    volumes:
      - ../backend:/src
      - ../.cache/go-mod:/go/pkg/mod
      - ../.cache/go-build:/tmp/gocache
      - ${STORAGE_HOST_PATH:-../data/dev}:/var/lib/terra:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  worker:
    image: terra-backend:local
    user: "${TERRA_UID:-1000}:${TERRA_GID:-1000}"
    env_file:
      - ../.env
    environment:
      APP_ENV: development
      STORAGE_ROOT: /var/lib/terra
      HOME: /tmp
      GOCACHE: /tmp/gocache
      GOMODCACHE: /go/pkg/mod
      GOPATH: /tmp/gopath
    working_dir: /src
    command: ["go", "run", "./cmd/worker"]
    volumes:
      - ../backend:/src
      - ../.cache/go-mod:/go/pkg/mod
      - ../.cache/go-build:/tmp/gocache
      - ${STORAGE_HOST_PATH:-../data/dev}:/var/lib/terra:rw
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    image: terra-web:local
    build:
      context: ../frontend
    environment:
      VITE_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
      VITE_API_PROXY: http://api:8080
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/tests:/app/tests
      - ../frontend/index.html:/app/index.html
      - ../frontend/vite.config.js:/app/vite.config.js
      - ../frontend/vitest.config.js:/app/vitest.config.js
      - ../frontend/playwright.config.js:/app/playwright.config.js
      - ../frontend/eslint.config.js:/app/eslint.config.js
    ports:
      - "${WEB_PORT:-8080}:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5173/@vite/client | grep -q '/node_modules/vite/dist/client'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  terra-db:
