# Production overrides: docker compose -f deploy/compose.yaml -f deploy/compose.prod.yaml up -d
# Requires an .env prepared for production (APP_ENV=production, HTTPS public URL,
# Turnstile keys, approved capacity limits and externally backed-up secrets).
services:
  db:
    restart: always
    ports: []
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  api:
    restart: always
    environment:
      APP_ENV: production
    volumes:
      - ${STORAGE_HOST_PATH_PROD:-/srv/terra-data/prod}:/var/lib/terra:ro
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  worker:
    restart: always
    environment:
      APP_ENV: production
    volumes:
      - ${STORAGE_HOST_PATH_PROD:-/srv/terra-data/prod}:/var/lib/terra:rw
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  web:
    restart: always
    ports:
      - "${WEB_PORT:-8080}:8080"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
