# Recarga automática del API en desarrollo.
# El binario temporal vive fuera del bind mount /src.
root = "."
tmp_dir = "/tmp/air-api"

[build]
  cmd = 'go build -ldflags "-X main.buildVersion=dev -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o /tmp/air-api/api ./cmd/api'
  bin = "/tmp/air-api/api"
  entrypoint = ["/tmp/air-api/api"]
  include_ext = ["go", "sql"]
  include_dir = ["cmd/api", "internal", "migrations"]
  include_file = ["go.mod", "go.sum"]
  exclude_dir = [".git", ".cache", "vendor", "tmp", "tests", "artifacts", "testdata"]
  exclude_regex = ["_test.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "20s"
  log = "/tmp/air-api-errors.log"

[log]
  time = true

[misc]
  clean_on_exit = true
