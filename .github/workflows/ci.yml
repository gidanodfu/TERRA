name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Comprobaciones de calidad solo con Docker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validar estructura requerida del repositorio
        run: |
          set -eu
          test -f deploy/compose.yaml
          test -f deploy/scripts/_common.sh
          test -x terra
          test -f backend/Dockerfile
          test -f frontend/Dockerfile
          test -f .env.example
          test -f docs/development/testing.md
          echo "Estructura requerida presente."

      - name: Preparar .env local controlado
        run: |
          set -eu
          cp .env.example .env
          chmod 600 .env
          STORAGE_DIR="${RUNNER_TEMP}/terra/storage"
          BACKUP_DIR="${RUNNER_TEMP}/terra/backups"
          mkdir -p "$STORAGE_DIR/staging" "$STORAGE_DIR/areas" "$BACKUP_DIR"
          chmod 750 "$STORAGE_DIR" "$STORAGE_DIR/staging" "$STORAGE_DIR/areas"
          chmod 700 "$BACKUP_DIR"
          SESSION_SECRET="$(openssl rand -hex 32)"
          TOKEN_KEY="$(openssl rand -base64 32)"
          sed -i \
            -e 's|^APP_ENV=.*|APP_ENV=development|' \
            -e 's|^APP_PUBLIC_URL=.*|APP_PUBLIC_URL=http://localhost:8080|' \
            -e 's|^POSTGRES_DB=.*|POSTGRES_DB=terra|' \
            -e 's|^POSTGRES_USER=.*|POSTGRES_USER=terra|' \
            -e 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-local-db-password|' \
            -e "s|^SESSION_SECRET=.*|SESSION_SECRET=$SESSION_SECRET|" \
            -e 's|^GOOGLE_CLIENT_ID=.*|GOOGLE_CLIENT_ID=ci-local-client-id|' \
            -e 's|^GOOGLE_CLIENT_SECRET=.*|GOOGLE_CLIENT_SECRET=ci-local-client-secret|' \
            -e 's|^GOOGLE_REDIRECT_URL=.*|GOOGLE_REDIRECT_URL=http://localhost:8080/api/v1/auth/google/callback|' \
            -e 's|^GOOGLE_DRIVE_REDIRECT_URL=.*|GOOGLE_DRIVE_REDIRECT_URL=http://localhost:8080/api/v1/auth/google/drive/callback|' \
            -e "s|^TOKEN_ENCRYPTION_KEY=.*|TOKEN_ENCRYPTION_KEY=$TOKEN_KEY|" \
            -e 's|^TURNSTILE_SITE_KEY=.*|TURNSTILE_SITE_KEY=ci-local-site-key|' \
            -e 's|^TURNSTILE_SECRET_KEY=.*|TURNSTILE_SECRET_KEY=ci-local-turnstile-secret|' \
            -e 's|^TURNSTILE_HOSTNAME=.*|TURNSTILE_HOSTNAME=localhost|' \
            -e "s|^STORAGE_HOST_PATH=.*|STORAGE_HOST_PATH=${STORAGE_DIR}|" \
            -e "s|^BACKUP_HOST_PATH=.*|BACKUP_HOST_PATH=${BACKUP_DIR}|" \
            -e 's|^WEB_PORT=.*|WEB_PORT=8080|' \
            -e 's|^DB_PORT=.*|DB_PORT=55432|' \
            -e 's|^MIN_FREE_DISK_BYTES=.*|MIN_FREE_DISK_BYTES=104857600|' \
            -e 's|^BOOTSTRAP_ADMIN_USERNAME=.*|BOOTSTRAP_ADMIN_USERNAME=admin|' \
            -e 's|^BOOTSTRAP_ADMIN_PASSWORD=.*|BOOTSTRAP_ADMIN_PASSWORD=ci-local-admin-password|' \
            .env
          dups="$(cut -d= -f1 .env | sort | uniq -d)"
          if [ -n "$dups" ]; then
            echo "Claves duplicadas en .env: $dups" >&2
            exit 1
          fi
          echo "Archivo .env de CI generado con valores ficticios (no secretos reales)."

      - name: Validar rutas temporales externas
        run: |
          set -eu
          STORAGE_DIR="$(sed -n 's/^STORAGE_HOST_PATH=//p' .env)"
          BACKUP_DIR="$(sed -n 's/^BACKUP_HOST_PATH=//p' .env)"
          STORAGE_REAL="$(realpath -m "$STORAGE_DIR")"
          BACKUP_REAL="$(realpath -m "$BACKUP_DIR")"
          WORKSPACE_REAL="$(realpath -m "$GITHUB_WORKSPACE")"
          test -d "$STORAGE_REAL"
          test -d "$BACKUP_REAL"
          test -w "$STORAGE_REAL"
          test -w "$BACKUP_REAL"
          case "$STORAGE_REAL/" in "$WORKSPACE_REAL/"*) echo "storage dentro del checkout" >&2; exit 1 ;; esac
          case "$BACKUP_REAL/" in "$WORKSPACE_REAL/"*) echo "backups dentro del checkout" >&2; exit 1 ;; esac
          test "$STORAGE_REAL" != "$BACKUP_REAL"
          case "$STORAGE_REAL/" in "$BACKUP_REAL/"*) echo "rutas solapadas" >&2; exit 1 ;; esac
          case "$BACKUP_REAL/" in "$STORAGE_REAL/"*) echo "rutas solapadas" >&2; exit 1 ;; esac
          echo "Rutas CI externas verificadas."

      - name: Validar entorno
        run: ./terra check

      - name: Validar montajes de Compose
        run: |
          set -eu
          docker compose --env-file .env -p terra -f deploy/compose.yaml config --quiet
          docker compose --env-file .env -p terra -f deploy/compose.yaml config --format json > /tmp/terra-compose.json
          python3 - <<'PY'
          import json, os
          env = {}
          with open('.env', encoding='utf-8') as handle:
              for line in handle:
                  line = line.strip()
                  if line and not line.startswith('#') and '=' in line:
                      key, value = line.split('=', 1)
                      env.setdefault(key, value)
          expected = os.path.realpath(env['STORAGE_HOST_PATH'])
          workspace = os.path.realpath(os.environ['GITHUB_WORKSPACE'])
          with open('/tmp/terra-compose.json', encoding='utf-8') as handle:
              compose = json.load(handle)
          for service in ('api', 'worker'):
              mounts = [v for v in compose['services'][service].get('volumes', []) if v.get('target') == '/var/lib/terra']
              assert len(mounts) == 1, f'{service}: montaje /var/lib/terra ausente o duplicado'
              source = os.path.realpath(mounts[0]['source'])
              assert source == expected, f'{service}: monta {source}, se esperaba {expected}'
              assert not (source == workspace or source.startswith(workspace + os.sep)), f'{service}: monta el checkout'
              if service == 'api':
                  assert mounts[0].get('read_only') is True, 'api debe montar solo lectura'
              else:
                  assert mounts[0].get('read_only') is not True, 'worker debe montar lectura/escritura'
          print('Montajes /var/lib/terra verificados contra la ruta externa.')
          PY

      - name: Construir imágenes Docker
        run: ./terra build

      - name: Validar imagen de producción
        run: |
          docker build             --target production             --build-arg VERSION="ci-${GITHUB_SHA::12}"             --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"             -t terra-backend:ci-production             ./backend
          docker run --rm --entrypoint sh terra-backend:ci-production -c             '! command -v go && ! command -v air && test -x /app/api && test -x /app/worker'

      - name: Inicializar TERRA
        run: ./terra init

      - name: Ejecutar todas las pruebas de frontend y backend
        run: ./terra test all

      - name: Recopilar diagnósticos en caso de fallo
        if: failure()
        run: |
          mkdir -p artifacts
          ./terra status > artifacts/ci-status.txt 2>&1 || true
          ./terra doctor > artifacts/ci-doctor.txt 2>&1 || true
          ./terra logs > artifacts/ci-logs.txt 2>&1 || true

      - name: Subir artefactos de pruebas y diagnóstico
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: terra-quality-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Detener contenedores
        if: always()
        run: ./terra down --remove || true
